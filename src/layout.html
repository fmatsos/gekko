<!doctype html>
<html lang="{{lang}}" class="{{html_class}}" data-motion="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_image_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0f1419">
<link rel="icon" href="{{root}}assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="{{root}}assets/fonts/space-grotesk.woff2" crossorigin>
{{head}}
<style>
{{css}}
</style>
<script>
/* animations on unless the visitor turned them off here, or asks for reduced motion (RGAA 13.8) */
try { var m = localStorage.getItem("site-motion"); } catch (e) {}
document.documentElement.dataset.motion = m || (matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on");
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header data-header>
  <a class="brand" href="{{root}}"><img src="{{root}}assets/logo-64.png" alt="" width="32" height="32"><span>{{name}}</span></a>
  <nav aria-label="Main">
    <ul>
      <li><a href="{{root}}docs/">Docs</a></li>
      <li><a href="{{repo}}/releases">Releases</a></li>
      <li><a href="{{repo}}">Source</a></li>
    </ul>
  </nav>
  <button type="button" class="motion" data-motion-toggle aria-pressed="true" hidden>Animations</button>
</header>
<main id="main" tabindex="-1">
{{main}}
</main>
<footer>
  <nav aria-label="Footer">
    <ul>
      <li><a href="{{root}}docs/">Documentation</a></li>
      <li><a href="{{root}}sitemap.html">Site map</a></li>
      <li><a href="{{repo}}/releases">Releases</a></li>
      <li><a href="{{repo}}">Source</a></li>
      <li><a href="{{repo}}/blob/main/LICENSE">Unlicense</a></li>
    </ul>
  </nav>
  <p>Gekko runs where your model runs. Not a cloud in this sky.</p>
</footer>
<div class="rail" data-rail aria-hidden="true"><div class="rail-thumb" data-rail-thumb></div></div>
<p class="sr-only" role="status" id="status"></p>
<script>
{{js}}
</script>
</body>
</html>
